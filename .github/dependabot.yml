version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Argentina/Buenos_Aires"
    open-pull-requests-limit: 5
    reviewers:
      - "maxi-chascomus"
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      development-dependencies:
        patterns:
          - "@types/*"
          - "@vitejs/*"
          - "eslint*"
          - "vitest*"
          - "@testing-library/*"
          - "jsdom"
          - "sharp"
        update-types:
          - "minor"
          - "patch"
      react-ecosystem:
        patterns:
          - "react"
          - "react-dom"
        update-types:
          - "minor"
          - "patch"