name: Deploy to Cloudflare Pages

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write
  actions: read

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    # Solo deploy si CI terminó exitosamente y están configurados los secrets
    if: github.event.workflow_run.conclusion == 'success' && secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != ''
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifacts from CI run
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
          run-id: ${{ github.event.workflow_run.id }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: ar360-web
          directory: dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          wranglerVersion: '3'