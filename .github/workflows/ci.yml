name: CI

on:
  push:
    branches: [master, main]
    paths-ignore:
      - '**.md'
      - '.gitignore'
  pull_request:
    branches: [master, main]
    paths-ignore:
      - '**.md'
      - '.gitignore'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

  test:
    name: Test (non-blocking - Node 24 compat issue)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests (threads pool for Node 24 compat)
        run: npm run test -- --pool=threads

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run build
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  check-dist:
    name: Check dist output
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Verify index.html exists
        run: test -f dist/index.html

      - name: Verify assets exist
        run: |
          test -f dist/assets/index-*.js
          test -f dist/assets/index-*.css

      - name: Verify HTML metadata
        run: |
          grep -q 'lang="es"' dist/index.html
          grep -q 'AR360°' dist/index.html
          grep -q 'og:title' dist/index.html
          grep -q 'twitter:card' dist/index.html
          grep -q 'application/ld+json' dist/index.html

      - name: Verify optimized images
        run: |
          ls -la dist/assets/*.webp
          test $(find dist/assets -name "*.webp" -size +200k | wc -l) -eq 0